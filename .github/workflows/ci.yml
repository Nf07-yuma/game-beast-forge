name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci

  build:
    name: Bundle sanity check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Android bundle
        run: npx expo export -p android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  build-apk:
    name: Build standalone APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # A debug build only contains a stub that loads JS from a running Metro
      # server, so it can't be installed and run standalone. Build the release
      # variant instead: it bundles the JS into the APK itself. This project
      # doesn't have a production keystore configured, so the release build
      # falls back to signing with the debug key (see signingConfigs.release
      # in android/app/build.gradle after prebuild) — fine for installing on
      # a test device, not for a Play Store submission.
      #
      # The Android Gradle Plugin auto-generates ~/.android/debug.keystore
      # with a random key if it's missing, which it always is on a fresh CI
      # runner. That means every build got a different signature, and Android
      # refuses to install an update signed by a different key than the one
      # already on the device — forcing an uninstall (wiping app storage,
      # including any settings persisted there) before every single install.
      # Installing a checked-in, stable debug keystore here keeps the
      # signature identical across builds so installs update in place.
      - name: Install stable debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/keystores/debug.keystore ~/.android/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beast-forge-apk
          path: android/app/build/outputs/apk/release/app-release.apk
