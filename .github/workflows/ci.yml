name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci

  build:
    name: Bundle sanity check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Android bundle
        run: npx expo export -p android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  build-apk:
    name: Build standalone APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # A debug build only contains a stub that loads JS from a running Metro
      # server, so it can't be installed and run standalone. Build the release
      # variant instead: it bundles the JS into the APK itself. This project
      # doesn't have a production keystore configured, so the release build
      # falls back to signing with the auto-generated debug key (see
      # signingConfigs.release in android/app/build.gradle after prebuild) —
      # fine for installing on a test device, not for a Play Store submission.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beast-forge-apk
          path: android/app/build/outputs/apk/release/app-release.apk
